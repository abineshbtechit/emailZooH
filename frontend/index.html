<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Connect Gmail</title>
  <!-- Telegram WebApp SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg-color: var(--tg-theme-bg-color, #ffffff);
      --text-color: var(--tg-theme-text-color, #0f172a);
      --hint-color: var(--tg-theme-hint-color, #64748b);
      --btn-color: var(--tg-theme-button-color, #2563eb);
      --btn-text: var(--tg-theme-button-text-color, #ffffff);
      --card-bg: var(--tg-theme-secondary-bg-color, #f8fafc);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
      text-align: center;
    }
    .card {
      background: var(--card-bg);
      border-radius: 20px;
      padding: 32px 24px;
      max-width: 360px;
      width: 100%;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
      border: 1px solid rgba(0, 0, 0, 0.06);
    }
    .icon {
      font-size: 54px;
      margin-bottom: 16px;
      display: inline-block;
    }
    h1 {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 8px;
    }
    p {
      font-size: 14px;
      color: var(--hint-color);
      line-height: 1.5;
      margin-bottom: 28px;
    }
    .features {
      text-align: left;
      margin-bottom: 28px;
      font-size: 13px;
      color: var(--text-color);
    }
    .feature-item {
      display: flex;
      align-items: center;
      margin-bottom: 10px;
      gap: 10px;
    }
    .btn-google {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      width: 100%;
      padding: 14px 20px;
      background: white;
      color: #1f2937;
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.1);
      transition: all 0.2s ease;
      text-decoration: none;
    }
    .btn-google:hover {
      background: #f9fafb;
      transform: translateY(-1px);
    }
    .btn-google svg {
      width: 20px;
      height: 20px;
    }
    .security-note {
      font-size: 11px;
      color: var(--hint-color);
      margin-top: 18px;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="icon">📬</div>
    <h1>Connect Your Gmail</h1>
    <p>Receive clean, AI-powered unread briefings directly in this Telegram chat.</p>

    <div class="features">
      <div class="feature-item">
        <span>✨</span> <strong>Strict Primary Inbox</strong> (Zero promo/spam noise)
      </div>
      <div class="feature-item">
        <span>🔒</span> <strong>Read-Only Access</strong> (We never send or delete emails)
      </div>
      <div class="feature-item">
        <span>⚡</span> <strong>On-Demand</strong> (Say "i want email" anytime)
      </div>
    </div>

    <button id="authBtn" class="btn-google" onclick="connectGmail()">
      <svg viewBox="0 0 24 24">
        <path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.66-5.17 3.66-9.17z"/>
        <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.93H1.25v3.15C3.26 21.36 7.36 24 12 24z"/>
        <path fill="#FBBC05" d="M5.28 14.27c-.25-.72-.38-1.49-.38-2.27s.13-1.55.38-2.27V6.58H1.25C.45 8.18 0 9.97 0 12s.45 3.82 1.25 5.42l4.03-3.15z"/>
        <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.36 0 3.26 2.64 1.25 6.58l4.03 3.15c.95-2.83 3.6-4.98 6.72-4.98z"/>
      </svg>
      Sign in with Google
    </button>

    <div class="security-note">
      End-to-end encrypted • Protected by Google OAuth
    </div>
  </div>

  <script>
    // Initialize Telegram WebApp
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
    }

    function getTelegramUserId() {
      // 1. From WebApp SDK
      if (tg?.initDataUnsafe?.user?.id) {
        return tg.initDataUnsafe.user.id;
      }
      // 2. From URL parameter fallback
      const urlParams = new URLSearchParams(window.location.search);
      return urlParams.get('telegram_id') || "";
    }

    function connectGmail() {
      const telegramId = getTelegramUserId();
      const btn = document.getElementById('authBtn');
      btn.innerText = "Redirecting to Google...";
      btn.style.opacity = "0.7";
      
      // Navigate to backend auth endpoint
      window.location.href = `/api/auth/google?telegram_id=${telegramId}`;
    }
  </script>
</body>
</html>
